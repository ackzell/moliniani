  "@motion-canvas/2d": ^3.17.2
  "@motion-canvas/core": ^3.17.2
  "@tresjs/core": ^5.8.0
  "@types/node": ^24
  "@types/three": ^0.184.0
  "@vitejs/plugin-vue": ^6.0.6
  "@vitest/coverage-v8": ^4.1.5
  "@vue/runtime-core": ^3.5.33
  "@vue/runtime-dom": ^3.5.33
